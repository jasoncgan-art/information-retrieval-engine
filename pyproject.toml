[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "information-retrieval-engine"
version = "0.1.0"
description = "A from-scratch lexical search engine with a positional inverted index and IR evaluation metrics."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "nltk>=3.8",
  "ir_datasets>=0.5.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
